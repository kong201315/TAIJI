<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智承太极 · 首页练习</title>
<style>
/* ============================================================
   第 1 步：设计 Tokens（颜色/字体/圆角 的"规矩"）
   —— 这些是"调料"，先备好，后面做饭时才不用到处找
   ============================================================ */
:root {
  /* 背景 */
  --bg: #F5F2ED;          /* 页面主背景：纸色暖白 */
  --bg-warm: #EDE9E3;     /* 次级暖色背景（进度条轨道等） */
  --card: #FFFFFF;        /* 卡片白 */

  /* 文字 */
  --text: #1A1A1A;          /* 主文字（近黑） */
  --text-secondary: #3A3632;/* 次级文字 */
  --text-muted: #7A756D;    /* 辅助/说明文字（灰） */

  /* 强调色：朱红 + 金色（太极主题） */
  --accent: #B8312F;        /* 主强调：朱红 */
  --accent-light: #FBF0F0;  /* 朱红浅底 */
  --gold: #C4A35A;          /* 金色点缀 */
  --gold-light: #F5EDDA;    /* 金色浅底 */
  --success: #3D8B37;       /* 成功绿 */

  /* 侧边栏深色系 */
  --nav-bg: #0F1419;        /* 深底 */
  --nav-bg-subtle: #161D25; /* 渐变底 */
  --nav-text: #C8C2B8;      /* 导航文字 */
  --nav-text-dim: #6B6560;  /* 导航灰字 */

  /* 圆角 & 阴影 */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --shadow-card: 0 2px 8px rgba(180,170,155,0.12);
  --shadow-md: 0 4px 16px rgba(26,26,26,0.08);

  /* 字体 */
  --font-ui: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  --font-serif: 'Noto Serif SC', 'SimSun', serif;  /* 标题衬线体 */
}

/* ============================================================
   第 2 步：Reset（清掉浏览器的默认样式）
   浏览器的每个标签都有默认边距，先全部清零，从"白纸"开始
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.6;
  background: var(--bg);
  color: var(--text);
}

/* ============================================================
   第 3 步往后：下面每一步，我们在这里逐步添加代码
   ============================================================ */
</style>
</head>
<body>
  <!-- 内容区：每一步都在这里添加 HTML 结构 -->
</body>
</html>
